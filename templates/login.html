{% extends "base.html" %}
{% block title %}Giriş — {{ site.site_title }}{% endblock %}
{% block content %}
<section class="section fade-in auth-section">
  <div class="card glass auth-card">
    <div class="panel-kicker">Hesap</div>
    <h2>Giriş Yap</h2>
    <p class="sub">Ödeme bildirimi ve kişisel alan için oturum açın</p>
    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="email">E-posta</label>
        <input id="email" name="email" type="email" required autocomplete="username" placeholder="ornek@mail.com" />
      </div>
      <div class="form-group">
        <label for="password">Şifre</label>
        <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="••••••••" />
      </div>
      <button class="btn btn-gold btn-block" type="submit" id="login-btn">Giriş Yap</button>
    </form>
    <div id="form-error" class="form-error" role="alert"></div>
    {% if site.registration_open %}
    <p class="auth-switch">Hesabınız yok mu? <a href="{{ url_for('register_page') }}">Kayıt olun</a></p>
    {% endif %}
  </div>
</section>
{% endblock %}
{% block scripts %}
<script>
document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const err = document.getElementById("form-error");
  const btn = document.getElementById("login-btn");
  err.classList.remove("show");
  btn.disabled = true;
  btn.classList.add("is-loading");
  try {
    const res = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify({
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value,
      }),
    });
    const data = await res.json();
    if (data.ok) {
      KCToast && KCToast("Hoş geldiniz");
      const next = {{ (next or '/odeme')|tojson }};
      window.location.href = next || "/odeme";
      return;
    }
    err.textContent = data.error || "Giriş başarısız";
    err.classList.add("show");
    KCToast && KCToast(data.error || "Giriş başarısız", true);
  } catch (_) {
    err.textContent = "Bağlantı hatası";
    err.classList.add("show");
  } finally {
    btn.disabled = false;
    btn.classList.remove("is-loading");
  }
});
</script>
{% endblock %}
